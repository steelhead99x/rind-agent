[package]
name = "rind-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0 OR ISC OR MIT-0"
description = "Checks the rind skills: frontmatter, links, privacy, action pins, and PR format."
repository = "https://github.com/steelhead99x/rind-agent"
publish = false

[[bin]]
name = "check"
path = "src/main.rs"

[dependencies]

[workspace]
members = [".", "tools/page-data", "tools/gen-frames"]
default-members = ["."]
