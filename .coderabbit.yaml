# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
# Review guidance for rind-agent skills and docs. CONTRIBUTING.md is the
# source of truth for skill format and privacy rules.
language: en-US
tone_instructions: "Terse and specific. Cite the file and the skill or CONTRIBUTING.md rule that is broken."
reviews:
  profile: assertive
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    base_branches:
      - ".*"
  path_filters:
    - "!**/*.lock"
  path_instructions:
    - path: "skills/**"
      instructions: >-
        Review skills as documentation that agents will follow.

        Accuracy: every rule should be checkable against rind or this
        repository (CONTRIBUTING.md, a named admin/ or sh/ script, a workflow,
        or a justfile recipe). Flag speculation, stale commands, or advice that
        conflicts with another skill or with CONTRIBUTING.md. Where a skill and
        rind disagree, rind wins. Link to rind's files rather than copying long
        sections.

        Format: one skill per directory under skills/, lowercase kebab-case,
        SKILL.md with YAML frontmatter whose name equals the directory and
        whose description starts with "Use when". Keep prose short and
        imperative. A new skill needs a row in the README table.

        Privacy: no personal names, account handles, email addresses, home
        directory paths, host names, machine or session IDs, tokens, or
        private repositories. Examples must use placeholders such as <fork>
        and /path/to/rind. Do not invent repository history, benchmark
        numbers, or dates.
    - path: "*.md"
      instructions: >-
        Check accuracy and consistency with the skills and with
        CONTRIBUTING.md. Flag private paths, hosts, account details, or
        secrets. Keep the README skill table in sync with skills/.
    - path: "src/**"
      instructions: >-
        The checker is a backstop for skill format, links, privacy, and pins.
        Flag changes that weaken those checks, that disagree with
        CONTRIBUTING.md, or that would miss a private path, host, or secret
        the docs forbid. Tests must not introduce private paths, hosts, or
        secrets.
    - path: ".github/**"
      instructions: >-
        CI should keep running the same local gate CONTRIBUTING.md describes
        (fmt, clippy, tests, and cargo run for the checker). Flag workflows
        that skip those checks or that leak secrets.
