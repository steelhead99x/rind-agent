name: Checker bug
description: The checker under src/ passes something it should refuse, or refuses something valid.
labels: [bug]
body:
  - type: textarea
    id: input
    attributes:
      label: Input
      description: The file, line, or PR title the checker got wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: The checker's output.
      render: text
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: This repository's commit.
    validations:
      required: true
