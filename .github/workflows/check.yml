name: Check

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's rustup; no third-party toolchain action.
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- --deny warnings

      - name: Test
        run: cargo test --workspace --locked

      # Skills, links, privacy, and action pins.
      - name: Check the tree
        run: cargo run --locked --quiet

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep in step with `rust-version` in Cargo.toml.
      - name: Toolchain
        run: rustup toolchain install 1.74 --profile minimal

      - name: Check
        run: cargo +1.74 check --workspace --all-targets --locked
